spring.application.name=trading-journal

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_journal
# spring.datasource.username=postgres
# spring.datasource.password=password
# spring.datasource.username=ilarikoikkalainen
spring.datasource.username=ilari
spring.datasource.password=ilari
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve uploaded images
spring.web.resources.static-locations=file:./uploads/,classpath:/static/

server.port=8080
